name: Refresh card index

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, so new sets show up within a week
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the index
        run: python scripts/build_index.py

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "No new cards."
            exit 0
          fi
          count=$(python -c "import json;print(len(json.load(open('data/cards.json'))))")
          git add data
          git commit -m "Refresh card index ($count cards)"
          git push
